
<style>
    .subscribe-button{
        background-color:rgb(225, 0, 0);
        color:white;
        height:50px;
        border:none; 
        width:100px;
        border-radius: 10px;
        cursor:pointer;
        margin-right: 10px;
        transition: opacity 1s;
    }
    .subscribe-button:hover{
        opacity:0.6;
    }
    .subscribe-button:active{
        opacity: 0.4;
    }
</style>
<button class="subscribe-button">
    subscribe
</button>
<button class="join-button">
    JOIN
</button>
<style>
    .join-button{
        background-color: rgba(252, 252, 252, 0.988);
        border-color: blueviolet;
        height: 50px;
        width: 100px;
        color: rgb(103, 103, 229) ;
        border-radius: 1px;
        cursor: pointer;
        border-style: solid;
        border-width:1px;
        font-weight:bold;
        transition: opacity 0.2s , background-color 0.21s, color 0.21s;
    }
    .join-button:hover{
        background-color: rgb(103, 103, 229);
        color: white;
    }
    .join-button:active{
        opacity:0.6;
    }
</style>
<button class="tweet">
    TWEET
</button>
<style>
    .tweet{
        background-color: rgb(118, 166, 243);
        border-radius:20px;
        height:50px;
        width:100px;
        color: white;
        cursor: pointer;
        border-style: solid;
        border:none;
        font-weight: bold;
        font-size:15px;
        margin-left:10px;
        transition:box-shadow 0.15s;
        padding-bottom: 5px;
    }
    .tweet:hover{
        box-shadow:5px 5px 5px rgba(0, 0, 0, 0.55);  
    }
</style>
